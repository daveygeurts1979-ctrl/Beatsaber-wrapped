name: Build QMOD

# Runs automatically on every push, and can also be triggered manually from
# the Actions tab (useful when you're doing everything from a phone browser).
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs the Android NDK on the runner and exposes its path.
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # QPM (Quest Package Manager) CLI — resolves beatsaber-hook/bsml/etc.
      # VERIFY: if this download URL 404s (QPM releases move occasionally),
      # grab the current Linux binary link from
      # https://github.com/QuestPackageManager/QPM.CLI/releases/latest
      # and swap it in below.
      - name: Install QPM
        run: |
          wget -q -O qpm https://github.com/QuestPackageManager/QPM.CLI/releases/latest/download/qpm-rust-linux
          chmod +x qpm
          sudo mv qpm /usr/local/bin/qpm

      - name: Export NDK path
        run: echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      - name: Restore dependencies
        run: qpm restore

      - name: Build
        run: qpm s build

      - name: Package .qmod
        run: qpm s qmod

      # Uploads whatever .qmod file got produced so you can grab it from the
      # run's summary page on your phone.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeatSaberWrapped-qmod
          path: '*.qmod'
